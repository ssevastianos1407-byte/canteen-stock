<script>
  const API_URL = "https://elementary-pos-stock-server.onrender.com/stock";
  const grid = document.getElementById("products");
  let products = [];
  let retries = 0;

  function showLoading(text = "Loading stock…") {
    grid.innerHTML = `<p style="color:#9ca3af">${text}</p>`;
  }

  async function loadStock() {
    showLoading("Waking up server…");

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error("Bad response");

      products = await res.json();
      render(products);
    } catch (err) {
      retries++;

      if (retries <= 5) {
        showLoading(`Still loading… (${retries}/5)`);
        setTimeout(loadStock, 8000); // retry every 8s
      } else {
        showLoading("Server is slow right now. Please refresh.");
      }
    }
  }

  function render(list) {
    if (!list.length) {
      grid.innerHTML = "<p>No products available</p>";
      return;
    }

    grid.innerHTML = "";
    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="name">${p.name}</div>
        <div class="stock">${p.stock} available</div>
      `;
      grid.appendChild(card);
    });
  }

  function filterProducts() {
    const q = document.getElementById("search").value.toLowerCase();
    render(products.filter(p => p.name.toLowerCase().includes(q)));
  }

  loadStock();
</script>
