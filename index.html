<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canteen Stock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .name {
      font-size: .95rem;
      margin-bottom: 10px;
    }

    .stock {
      font-weight: bold;
      color: var(--accent);
      font-size: .9rem;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: .8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🥪 Canteen Stock</h1>
    <p>Available right now</p>
  </header>

  <input
    type="text"
    id="search"
    placeholder="Search product..."
    oninput="filterProducts()"
  />

  <div class="grid" id="products"></div>

  <footer>
    Updated live from canteen
  </footer>

  <script>
    const API_URL = "https://elementary-pos-stock-server.onrender.com/stock";
    let products = [];

    async function loadStock() {
      try {
        const res = await fetch(API_URL);
        products = await res.json();
        render(products);
      } catch {
        document.getElementById("products").innerHTML =
          "<p>Failed to load stock</p>";
      }
    }

    function render(list) {
      const grid = document.getElementById("products");
      grid.innerHTML = "";

      list.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="name">${p.name}</div>
          <div class="stock">${p.stock} available</div>
        `;

        grid.appendChild(card);
      });
    }

    function filterProducts() {
      const q = document.getElementById("search").value.toLowerCase();
      render(products.filter(p => p.name.toLowerCase().includes(q)));
    }

    loadStock();
  </script>

</body>
</html>
